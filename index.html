<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#c0392b">
<title>人情簿 · 份子钱与人情往来记录</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f6f3ee;--panel:#fff;--panel-2:#fbf9f6;--text:#2a2521;--text-2:#6b6259;--muted:#9a9086;
  --border:#ece6dd;--primary:#c0392b;--primary-2:#e2604f;--primary-soft:#fdeeeb;
  --gold:#c8952f;--gold-soft:#fdf6e6;--green:#2f8f5b;--green-soft:#e9f6ef;
  --blue:#3b6fb6;--blue-soft:#eaf1fb;
  --shadow-sm:0 1px 2px rgba(70,50,30,.05),0 2px 8px rgba(70,50,30,.05);
  --shadow-md:0 4px 16px rgba(70,50,30,.08),0 1px 3px rgba(70,50,30,.04);
  --radius:16px;--nav-h:64px;
}
html[data-theme="dark"]{
  --bg:#141210;--panel:#1e1b17;--panel-2:#252119;--text:#f2ece2;--text-2:#c3b8a9;--muted:#8d8377;
  --border:#332d25;--primary:#e2685a;--primary-2:#f0836f;--primary-soft:#3a221e;
  --gold:#e0b355;--gold-soft:#332a18;--green:#5cb98a;--green-soft:#1c2c23;
  --blue:#7aa6e0;--blue-soft:#1b2430;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 6px 20px rgba(0,0,0,.35);
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background-color:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5;transition:background-color .25s,color .25s}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;flex:0 0 230px;padding:22px 14px 18px;border-right:1px solid var(--border);background:var(--panel);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.brand-logo{width:40px;height:40px;border-radius:13px;flex:0 0 40px;background:linear-gradient(135deg,#c0392b,#d9a441);display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;letter-spacing:1px}
.brand-name{font-size:15.5px;font-weight:700}
.brand-sub{font-size:11.5px;color:var(--muted);margin-top:-1px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--text-2);cursor:pointer;font-size:14px;font-weight:500;transition:.18s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:650}
.nav-item svg{width:18px;height:18px;flex:0 0 18px}
.sidebar-foot{padding-top:12px;border-top:1px solid var(--border);margin-top:8px;display:flex;flex-direction:column;gap:8px}
.sync-label{font-size:11.5px;color:var(--muted);padding:0 8px 4px;display:flex;align-items:center}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.sync-dot.ok{background:var(--green)}.sync-dot.busy{background:var(--gold);animation:pulse 1s infinite}
.sync-dot.idle{background:var(--muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
main{flex:1;min-width:0;padding:26px 30px 70px}
.view[hidden]{display:none}.view{animation:fadeUp .26s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:750;letter-spacing:-.4px}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:11px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13.5px;font-weight:550;cursor:pointer;transition:.18s;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:#d8cec1;transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(192,57,43,.26)}
.btn-primary:hover{box-shadow:0 7px 20px rgba(192,57,43,.34)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--panel-2);box-shadow:none;border-color:transparent}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn-danger{color:var(--primary)}.btn-danger:hover{background:var(--primary-soft);border-color:var(--primary)}
.btn-block{width:100%;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);transition:.2s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:9px;font-weight:550}
.stat-value{font-size:26px;font-weight:750;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.stat-foot{font-size:12px;color:var(--muted);margin-top:7px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.card-head{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-title{font-size:14.5px;font-weight:650}
.card-body{padding:16px 20px}.card-body.p0{padding:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid-2-3{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.mb16{margin-bottom:16px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.5px;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel-2)}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
tbody tr{transition:background .14s}tbody tr:hover{background:var(--panel-2)}tbody tr:last-child td{border-bottom:none}
.td-name{font-weight:650}.td-note{color:var(--muted);font-size:12.5px;white-space:normal;max-width:200px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.amt-in{color:var(--green)}.amt-out{color:var(--primary)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.tag-in{background:var(--green-soft);color:var(--green)}
.tag-out{background:var(--primary-soft);color:var(--primary)}
.tag-plain{background:var(--panel-2);color:var(--text-2);border:1px solid var(--border)}
.tag-gold{background:var(--gold-soft);color:var(--gold)}
.tag-blue{background:var(--blue-soft);color:var(--blue)}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:190px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.search input{padding-left:35px}
input,select,textarea{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);outline:none;transition:.16s;width:100%}
@media(min-width:861px){input,select,textarea{font-size:13.5px}}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:var(--panel);box-shadow:0 0 0 3px var(--primary-soft)}
.toolbar select{width:auto;min-width:112px}
textarea{resize:vertical;min-height:70px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.person{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;transition:.2s}
.person:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.person-head{padding:16px 18px;cursor:pointer;user-select:none}
.person-top{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:0 0 40px}
.person-name{font-size:15px;font-weight:700}
.person-meta{font-size:12px;color:var(--muted);margin-top:1px}
.person-nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.pnum{background:var(--panel-2);border-radius:11px;padding:8px 4px}
.pnum-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.pnum-val{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.person-detail{border-top:1px solid var(--border);background:var(--panel-2);display:none}
.person.open .person-detail{display:block}
.person-detail-inner{padding:10px 16px}
.pd-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.pd-row:last-child{border-bottom:none}
.pd-date{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 76px}
.pd-event{flex:1;color:var(--text-2)}
canvas{width:100%;height:230px;display:block}canvas.donut{height:200px}
.legend{display:flex;flex-direction:column;gap:9px;font-size:13px}
.legend-item{display:flex;align-items:center;gap:8px}
.legend-val{margin-left:auto;color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px}
.bar-row{display:grid;grid-template-columns:68px 1fr auto;gap:11px;align-items:center;margin-bottom:11px;font-size:12.5px}
.bar-row:last-child{margin-bottom:0}
.bar-track{height:9px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .55s cubic-bezier(.2,.8,.3,1)}
.bar-value{color:var(--text-2);font-variant-numeric:tabular-nums;font-weight:650;min-width:62px;text-align:right}
.seg{display:flex;gap:6px;background:var(--panel-2);padding:4px;border-radius:12px;border:1px solid var(--border)}
.seg-btn{flex:1;padding:9px;border-radius:9px;border:none;background:transparent;color:var(--text-2);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:.16s}
.seg-btn.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm)}
.seg-btn[data-dir="in"].active{color:var(--green)}.seg-btn[data-dir="out"].active{color:var(--primary)}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty-icon{font-size:38px;margin-bottom:12px;opacity:.55}
.empty-title{font-size:14.5px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.empty-sub{font-size:12.5px}
.overlay{position:fixed;inset:0;background:rgba(40,30,20,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.overlay.show{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:20px;width:100%;max-width:580px;max-height:92vh;overflow:auto;box-shadow:0 24px 70px rgba(30,20,10,.34);animation:pop .24s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2;border-radius:20px 20px 0 0}
.modal-head h3{font-size:16px;font-weight:700}
.icon-btn{width:34px;height:34px;border-radius:10px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:21px;line-height:1;transition:.16s;font-family:inherit}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.modal-body{padding:20px 22px}
.modal-foot{padding:16px 22px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.req{color:var(--primary)}
.hint{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 22px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.26s;z-index:200;box-shadow:0 10px 28px rgba(0,0,0,.22);max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.dl{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.dl:last-child{border-bottom:none}.dl dt{color:var(--muted)}.dl dd{font-weight:650;font-variant-numeric:tabular-nums}
.kv-big{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.mobile-nav,.mobile-topbar{display:none}
@media(max-width:860px){
  .sidebar{display:none}.app{flex-direction:column}
  .mobile-topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
  .mobile-topbar .brand-logo{width:32px;height:32px;flex:0 0 32px;font-size:14px;border-radius:10px}
  .mobile-topbar .brand-name{font-size:15px}.mobile-topbar .spacer{flex:1}
  main{padding:0}.view{padding:16px 15px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
  .topbar{margin-bottom:14px;gap:8px}.page-title{font-size:19px}.page-sub{font-size:12px}
  .topbar .btn-primary{padding:8px 14px;font-size:13px}
  .stats{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{padding:14px 14px}.stat-label{font-size:11.5px;margin-bottom:6px}
  .stat-value{font-size:19px}.stat-foot{font-size:11px;margin-top:5px}
  .grid-2,.grid-2-3{grid-template-columns:1fr;gap:14px}
  .card-head{padding:13px 16px}.card-title{font-size:14px}
  .card-body{padding:14px 16px}.card-body.p0{padding:0}
  .table-wrap{overflow:visible}table{font-size:14px}
  table thead{display:none}table,tbody,tr,td{display:block;width:100%}
  tbody tr{border-bottom:1px solid var(--border);padding:14px 16px 12px;position:relative;white-space:normal}
  tbody tr:last-child{border-bottom:none}tbody tr:hover{background:transparent}
  td{padding:2px 0;border:none;white-space:normal;text-align:left!important}
  td:empty{display:none}
  td[data-label]::before{content:attr(data-label);color:var(--muted);font-size:11px;display:inline-block;min-width:44px;margin-right:6px;font-weight:500}
  .td-name{font-size:15.5px;font-weight:700;padding-right:90px;margin-bottom:4px}
  .td-name::before{display:none}
  td.td-amount{position:absolute;top:14px;right:16px;font-size:16px;padding:0;text-align:right!important}
  td.td-amount::before{display:none}
  .td-actions{display:flex!important;gap:8px;justify-content:flex-end;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)}
  .td-actions::before{display:none!important}.td-actions .btn{padding:6px 12px;font-size:12.5px}
  .td-note{max-width:none;font-size:12.5px}
  .people{grid-template-columns:1fr;gap:12px}
  .person-head{padding:14px 16px}.person-nums{gap:6px}.pnum{padding:7px 4px}
  .pnum-label{font-size:10.5px}.pnum-val{font-size:12.5px}
  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;max-height:94vh;border-radius:22px 22px 0 0;animation:slideUp .3s cubic-bezier(.2,.9,.3,1.05)}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  .modal-head{padding:16px 18px;border-radius:22px 22px 0 0}
  .modal-body{padding:18px}.modal-foot{padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
  .modal-foot .btn{flex:1;padding:12px}.form-grid{grid-template-columns:1fr;gap:12px;margin-top:14px}
  .toolbar{gap:8px}.toolbar select{flex:1;min-width:0;font-size:14px}
  .search{flex:1 0 100%;min-width:0}
  input,select,textarea{padding:11px 12px;font-size:16px;border-radius:12px}
  canvas{height:200px}canvas.donut{height:170px}
  .legend{font-size:12px;gap:8px}.legend-val{font-size:11.5px}
  .data-grid{grid-template-columns:1fr;gap:12px}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--border);z-index:50;box-shadow:0 -4px 20px rgba(70,50,30,.08)}
  .mobile-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px;border-radius:12px;border:none;background:transparent;color:var(--text-2);font-size:10.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:.16s}
  .mobile-nav-item svg{width:21px;height:21px}
  .mobile-nav-item.active{color:var(--primary);background:var(--primary-soft)}
  .mobile-nav-item:active{transform:scale(.95)}
}
.theme-fab{width:36px;height:36px;border-radius:12px;border:none;background:var(--panel-2);color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:17px;line-height:1;transition:.18s;flex:0 0 36px}
.theme-fab:hover{background:var(--primary-soft);color:var(--primary)}.theme-fab:active{transform:scale(.92)}
.auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background-color:var(--bg)}
</style>
</head>
<body>

<!-- 登录/注册界面（默认显示） -->
<div id="authScreen" class="auth-screen">
  <div class="card" style="width:100%;max-width:400px;padding:28px">
    <div style="text-align:center;margin-bottom:22px">
      <div class="brand-logo" style="margin:0 auto 12px;width:48px;height:48px;font-size:20px">簿</div>
      <h2 style="font-size:20px;font-weight:750">人情簿</h2>
      <p style="font-size:13px;color:var(--muted);margin-top:6px">登录后手机电脑自动同步</p>
    </div>
    <div class="field"><label>邮箱</label><input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email"></div>
    <div class="field" style="margin-top:12px"><label>密码</label><input id="authPassword" type="password" placeholder="至少 6 位密码" autocomplete="current-password"></div>
    <div id="authError" style="color:var(--primary);font-size:12.5px;margin-top:10px;min-height:18px"></div>
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn btn-primary" style="flex:1" onclick="handleAuth('signin')">登录</button>
      <button class="btn" style="flex:1" onclick="handleAuth('signup')">注册</button>
    </div>
    <div class="hint" style="margin-top:16px;text-align:center">首次使用请先点「注册」创建账号</div>
  </div>
</div>

<!-- 主应用（登录后显示） -->
<div class="app" id="appContainer" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">簿</div>
      <div><div class="brand-name">人情簿</div><div class="brand-sub">份子钱往来记录</div></div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>概览</span></button>

<script>
/* ============================================================

const PALETTE = ['#c0392b','#d97b2b','#c8a02e','#5b9e6b','#3b7fb6','#7a6bb5','#c2557f','#4fa3a3','#8d6e63','#9aa05b','#6c7a89'];

const $$ = (s,p=document) => Array.from(p.querySelectorAll(s));

const shortNum = n => { n=Number(n)||0; const a=Math.abs(n); if(a>=1e8) return (n/1e8).toFixed(2).replace(/\.?0+$/,'')+'亿'; if(a>=1e4) return (n/1e4).toFixed(1).replace(/\.0$/,'')+'万'; return n.toLocaleString('zh-CN',{maximumFractionDigits:0}); };
const today = () => { const d=new Date(),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hashColor = s => { let h=0; for(let i=0;i<String(s).length;i++) h=(h*31+String(s).charCodeAt(i))>>>0; return PALETTE[h%PALETTE.length]; };
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400); }

/* ============================================================
 *  3. 认证相关
 * ============================================================ */
async function checkAuth(){
  const { data: { session } } = await supabase.auth.getSession();
  if (session){
    currentUserEmail = session.user.email;
    $('#authScreen').style.display = 'none';
    $('#appContainer').style.display = 'flex';
    await loadRecordsFromSupabase();
    return true;
  } else {
    $('#authScreen').style.display = 'flex';
    $('#appContainer').style.display = 'none';
    return false;
  }
}

async function handleAuth(mode){
  const email = $('#authEmail').value.trim();
  const password = $('#authPassword').value;
  const errEl = $('#authError');
  errEl.textContent = '';
  if (!email || !password){ errEl.textContent = '请填写邮箱和密码'; return; }
  if (mode === 'signup' && password.length < 6){ errEl.textContent = '密码至少 6 位'; return; }
  errEl.textContent = '处理中…';
  const { error } = mode === 'signup'
    ? await supabase.auth.signUp({ email, password })
    : await supabase.auth.signInWithPassword({ email, password });
  if (error){ errEl.textContent = error.message; return; }
  errEl.textContent = '';
  await checkAuth();
  if (mode === 'signup') toast('注册成功！如提示需要确认，请查收邮件');
  else toast('登录成功');
}

async function signOut(){
  await supabase.auth.signOut();
  location.reload();
}

supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT'){
    $('#authScreen').style.display = 'flex';
    $('#appContainer').style.display = 'none';
    db = { records: [] };
  }
});

/* ============================================================
 *  4. Supabase 数据读写
 * ============================================================ */
async function loadRecordsFromSupabase(){
  const { data, error } = await supabase.from('records').select('*').order('date',{ascending:false});
  if (error){ toast('加载失败：'+error.message); return; }
  db.records = (data||[]).map(r => ({
    id: r.id, name: r.name, relation: r.relation, event: r.event,
    direction: r.direction, amount: Number(r.amount)||0, date: r.date,
    method: r.method||'', location: r.location||'', note: r.note||'',
    createdAt: new Date(r.created_at).getTime(), updatedAt: Date.now()
  }));
  render();
}

async function saveRecord(e){
  e.preventDefault();
  const name = $('#f-name').value.trim();
  const amount = parseFloat($('#f-amount').value);
  if (!name){ toast('请填写姓名'); return; }
  if (!(amount >= 0)){ toast('请填写正确金额'); return; }
  const payload = {
    name, relation: $('#f-relation').value||'其他',
    event: $('#f-event').value||'其他', direction: formDirection,
    amount, date: $('#f-date').value||today(),
    method: $('#f-method').value||'', location: $('#f-location').value.trim(),
    note: $('#f-note').value.trim()
  };
  const btn = $('#recordForm button[type="submit"]');
  btn.disabled = true; btn.textContent = '保存中…';
  let error;
  if (editingId){
    ({ error } = await supabase.from('records').update(payload).eq('id', editingId));
  } else {
    ({ error } = await supabase.from('records').insert(payload));
  }
  btn.disabled = false; btn.textContent = '保存';
  if (error){ toast('保存失败：'+error.message); return; }
  closeModal();
  await loadRecordsFromSupabase();
  toast(editingId ? '已更新' : '已添加');
}

async function deleteRecord(id){
  const rec = db.records.find(r => r.id === id);
  if (!rec) return;
  if (!confirm(`确定删除「${rec.name} · ${rec.event} · ${money(rec.amount)}」？`)) return;
  const { error } = await supabase.from('records').delete().eq('id', id);
  if (error){ toast('删除失败：'+error.message); return; }
  await loadRecordsFromSupabase();
  toast('已删除');
}

/* ============================================================
 *  5. 业务计算
 * ============================================================ */
const sumBy = (rs,dir) => rs.filter(r=>r.direction===dir).reduce((s,r)=>s+(Number(r.amount)||0),0);
function personStats(){
  const map = new Map();
  db.records.forEach(r => {
    const k = (r.name||'未知').trim();
    if (!map.has(k)) map.set(k,{name:k,relation:r.relation||'其他',in:0,out:0,count:0,records:[],last:''});
    const p = map.get(k);
    p.records.push(r); p.count++;
    if (r.direction==='in') p.in += Number(r.amount)||0; else p.out += Number(r.amount)||0;
    if (r.relation) p.relation = r.relation;
    if (!p.last || (r.date||'')>p.last) p.last = r.date||'';
  });
  return Array.from(map.values()).map(p=>Object.assign(p,{net:p.in-p.out}))
    .sort((a,b)=>Math.abs(b.net)-Math.abs(a.net)||b.count-a.count);
}
const sortRecordsDesc = list => list.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||((b.createdAt||0)-(a.createdAt||0)));

/* ============================================================
 *  6. 导航与渲染
 * ============================================================ */
function navigate(view){
  currentView = view;
  $$('.nav-item, .mobile-nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  $$('.view').forEach(el => { el.hidden = (el.id !== 'view-'+view); });
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function render(){
  if (currentView==='dashboard') renderDashboard();
  else if (currentView==='records') renderRecords();
  else if (currentView==='people') renderPeople();
  else if (currentView==='stats') renderStats();
  else if (currentView==='data') renderData();
}

function renderDashboard(){
  const recs = db.records;
  const totalIn = sumBy(recs,'in'), totalOut = sumBy(recs,'out'), net = totalIn-totalOut;
  const people = personStats();
  const inCount = recs.filter(r=>r.direction==='in').length;
  const outCount = recs.length - inCount;
  const oweList = people.filter(p=>p.net>0.001).sort((a,b)=>b.net-a.net).slice(0,5);
  const recent = sortRecordsDesc(recs).slice(0,8);

  const oweHTML = oweList.length ? oweList.map(p=>`
    <div class="pd-row" style="padding:11px 0">
      <div class="avatar" style="width:34px;height:34px;flex:0 0 34px;font-size:13px;border-radius:11px;background:${hashColor(p.name)}">${esc(p.name.slice(0,1))}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:650;font-size:13.5px">${esc(p.name)}</div><div style="font-size:11.5px;color:var(--muted)">${esc(p.relation)} · ${p.count} 次往来</div></div>
      <div style="text-align:right;margin-right:4px"><div class="amt amt-out" style="font-size:13.5px">${money(p.net)}</div></div>
      <button class="btn btn-sm" data-act="quickAdd" data-name="${esc(p.name)}" data-relation="${esc(p.relation)}">记一笔</button>
    </div>`).join('')
    : `<div class="empty" style="padding:28px 10px"><div class="empty-icon">⚖️</div><div class="empty-title">人情两清</div><div class="empty-sub">目前没有需要偿还的人情</div></div>`;

  const recentHTML = recent.length ? `
    <div class="table-wrap"><table>
      <thead><tr><th>日期</th><th>姓名</th><th>事由</th><th style="text-align:right">金额</th></tr></thead>
      <tbody>${recent.map(r=>`
        <tr data-act="edit" data-id="${r.id}" style="cursor:pointer">
          <td data-label="日期" style="color:var(--muted);font-variant-numeric:tabular-nums">${esc((r.date||'').slice(5))}</td>
          <td data-label="姓名" class="td-name">${esc(r.name)}</td>
          <td data-label="事由"><span class="tag ${r.direction==='in'?'tag-in':'tag-out'}">${r.direction==='in'?'收':'送'}</span> ${esc(r.event)}</td>
          <td data-label="金额" class="td-amount amt ${r.direction==='in'?'amt-in':'amt-out'}">${r.direction==='in'?'+':'-'}${money(r.amount)}</td>
        </tr>`).join('')}</tbody>
    </table></div>`
    : `<div class="empty" style="padding:34px 10px"><div class="empty-icon">📖</div><div class="empty-title">还没有记录</div><div class="empty-sub">点击右上角「添加记录」开始记账</div></div>`;

  $('#view-dashboard').innerHTML = `
    <div class="topbar">
      <div><div class="page-title">概览</div><div class="page-sub">${recs.length?`已记录 ${recs.length} 笔 · ${people.length} 位亲友`:'记录每一份人情，往来有数'}</div></div>
      <div class="spacer"></div>
      <button class="btn btn-primary" data-act="add">＋ 添加记录</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-label"><span class="dot" style="background:var(--green)"></span>累计收礼</div><div class="stat-value" style="color:var(--green)">${money(totalIn)}</div><div class="stat-foot">共 ${inCount} 笔</div></div>
      <div class="stat"><div class="stat-label"><span class="dot" style="background:var(--primary)"></span>累计送礼</div><div class="stat-value" style="color:var(--primary)">${money(totalOut)}</div><div class="stat-foot">共 ${outCount} 笔</div></div>
      <div class="stat"><div class="stat-label"><span class="dot" style="background:var(--gold)"></span>净结余</div><div class="stat-value" style="color:${net>=0?'var(--green)':'var(--primary)'}">${net>=0?'+':''}${money(net)}</div><div class="stat-foot">${net>=0?'收大于送':'送大于收'}</div></div>
      <div class="stat"><div class="stat-label"><span class="dot" style="background:var(--blue)"></span>往来人数</div><div class="stat-value" style="color:var(--blue)">${people.length}<span style="font-size:15px;font-weight:600;color:var(--muted)"> 人</span></div><div class="stat-foot">${people.filter(p=>p.net>0.001).length} 人待还</div></div>
    </div>
    <div class="grid-2">
      <div class="card"><div class="card-head"><div class="card-title">💌 待还人情</div><div class="spacer"></div><span class="tag tag-out">${people.filter(p=>p.net>0.001).length} 人</span></div><div class="card-body" style="padding:6px 20px 12px">${oweHTML}</div></div>
      <div class="card"><div class="card-head"><div class="card-title">🕒 最近往来</div><div class="spacer"></div><button class="btn btn-sm btn-ghost" data-act="goto" data-view="records">全部 →</button></div><div class="card-body p0">${recentHTML}</div></div>
    </div>`;
}

function renderRecords(){
  const all = db.records;
  const years = Array.from(new Set(all.map(r=>(r.date||'').slice(0,4)).filter(Boolean))).sort().reverse();
  const events = Array.from(new Set(all.map(r=>r.event).filter(Boolean)));
  $('#view-records').innerHTML = `
    <div class="topbar"><div><div class="page-title">往来记录</div><div class="page-sub" id="recCount">共 ${all.length} 条</div></div><div class="spacer"></div><button class="btn btn-primary" data-act="add">＋ 添加</button></div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="searchInput" placeholder="搜索姓名 / 事由 / 备注…" autocomplete="off"></div>
      <select id="filterDir"><option value="all">全部方向</option><option value="in">收礼</option><option value="out">送礼</option></select>
      <select id="filterEvent"><option value="all">全部事由</option>${events.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join('')}</select>
      <select id="filterYear"><option value="all">全部年份</option>${years.map(y=>`<option value="${esc(y)}">${esc(y)} 年</option>`).join('')}</select>
      <button class="btn btn-sm" data-act="clearFilter">重置</button>
    </div>
    <div id="recTableWrap"></div>`;
  let t;
  $('#searchInput').addEventListener('input', () => { clearTimeout(t); t = setTimeout(updateRecordsTable, 180); });
  ['filterDir','filterEvent','filterYear'].forEach(id => $('#'+id).addEventListener('change', updateRecordsTable));
  updateRecordsTable();
}
function filterRecords(){
  const q = ($('#searchInput')?.value||'').trim().toLowerCase();
  const dir = $('#filterDir')?.value||'all';
  const ev = $('#filterEvent')?.value||'all';
  const yr = $('#filterYear')?.value||'all';
  return sortRecordsDesc(db.records.filter(r => {
    if (dir!=='all' && r.direction!==dir) return false;
    if (ev!=='all' && r.event!==ev) return false;
    if (yr!=='all' && (r.date||'').slice(0,4)!==yr) return false;
    if (q){ const hay=[r.name,r.relation,r.event,r.location,r.note,r.method].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }));
}

function getBarData(mode){
  const recs = db.records;
  if (mode === 'year'){
    const map = new Map();
    recs.forEach(r => {

      if (r.direction==='in') o.income += Number(r.amount)||0; else o.expense += Number(r.amount)||0;
    });
    return Array.from(map.values()).sort((a,b)=>a.label.localeCompare(b.label));
  }
  const now = new Date(); const arr = [];
  for (let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; arr.push({label:key.slice(2).replace('-','/'),key,income:0,expense:0}); }

  return arr;
}

/* ============================================================
 *  7. 图表
 * ============================================================ */
function prep(cv){ const dpr=window.devicePixelRatio||1; const rect=cv.getBoundingClientRect(); const w=Math.max(rect.width,100), h=Math.max(rect.height,80); cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h); return {ctx,w,h}; }
function roundRect(ctx,x,y,w,h,r,color){ if(h<=0.5||w<=0) return; r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath(); ctx.fillStyle=color; ctx.fill(); }
function niceCeil(v){ if(v<=0) return 100; const exp=Math.pow(10,Math.floor(Math.log10(v))); const f=v/exp; let nf; if(f<=1) nf=1; else if(f<=2) nf=2; else if(f<=2.5) nf=2.5; else if(f<=5) nf=5; else nf=10; return nf*exp; }
function drawEmptyCanvas(ctx,w,h,text){ ctx.fillStyle=cssVar('--muted'); ctx.font='13px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text||'暂无数据',w/2,h/2); }
function drawBars(cv,data){
  const {ctx,w,h} = prep(cv);
  if (!data.length || data.every(d=>!d.income&&!d.expense)){ drawEmptyCanvas(ctx,w,h); return; }
  const pad={t:18,r:14,b:36,l:54}; const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
  const max = Math.max(...data.map(d=>Math.max(d.income,d.expense))); const top=niceCeil(max);
  ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for (let i=0;i<=4;i++){ const y=pad.t+ch-ch*i/4; ctx.strokeStyle=cssVar('--border'); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(pad.l,y+.5); ctx.lineTo(pad.l+cw,y+.5); ctx.stroke(); ctx.fillStyle=cssVar('--muted'); ctx.fillText(shortNum(top*i/4),pad.l-8,y); }
  const n=data.length, slot=cw/n; const bw=Math.min(24,Math.max(7,slot*0.28)); const gap=4;
  const green=cssVar('--green')||'#2f8f5b', red=cssVar('--primary')||'#c0392b';
  data.forEach((d,i)=>{
    const cx=pad.l+slot*i+slot/2;
    roundRect(ctx,cx-bw-gap/2,pad.t+ch-ch*(d.income/top),bw,ch*(d.income/top),4,green);
    roundRect(ctx,cx+gap/2,pad.t+ch-ch*(d.expense/top),bw,ch*(d.expense/top),4,red);
    ctx.fillStyle=cssVar('--muted'); ctx.textAlign='center'; ctx.textBaseline='top';
    const label = n>14 ? (i%2===0?d.label:'') : d.label;
    ctx.fillText(label,cx,pad.t+ch+10);
  });
}
function drawDonut(cv,items){
  const {ctx,w,h} = prep(cv);
  const total = items.reduce((s,i)=>s+i.value,0);
  if (!total){ drawEmptyCanvas(ctx,w,h); return; }
  const cx=w/2, cy=h/2, R=Math.min(w,h)/2-6, r=R*0.62;
  let a=-Math.PI/2;
  items.forEach(it=>{
    const ang=(it.value/total)*Math.PI*2;
    ctx.beginPath(); ctx.arc(cx,cy,R,a,a+ang); ctx.arc(cx,cy,r,a+ang,a,true); ctx.closePath();
    ctx.fillStyle=it.color; ctx.fill();
    ctx.strokeStyle=cssVar('--panel'); ctx.lineWidth=2; ctx.stroke();
    a+=ang;
  });
  ctx.fillStyle=cssVar('--text'); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='700 17px -apple-system,sans-serif'; ctx.fillText(shortNum(total),cx,cy-7);
  ctx.font='11px -apple-system,sans-serif'; ctx.fillStyle=cssVar('--muted'); ctx.fillText('往来总额',cx,cy+12);
}

function download(content,filename,type){ const blob=new Blob([content],{type:type||'application/octet-stream'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),1000); }
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }

function csvCell(v){ v=(v===null||v===undefined)?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCSV(){
  if (!db.records.length){ toast('暂无数据'); return; }
  const head=['日期','姓名','关系','事由','方向','金额','方式','地点','备注'];
  const rows = sortRecordsDesc(db.records).map(r=>[r.date,r.name,r.relation,r.event,r.direction==='in'?'收礼':'送礼',r.amount,r.method,r.location,r.note]);
  const csv = [head, ...rows].map(row=>row.map(csvCell).join(',')).join('\r\n');
  download('\uFEFF'+csv,`人情簿_${stamp()}.csv`,'text/csv;charset=utf-8');

function normalizeRecord(r){
  if (!r||typeof r!=='object') return null;
  const dirRaw = r.direction ?? r.方向 ?? '';
  const dir = (dirRaw==='in'||dirRaw==='收礼'||dirRaw==='收')?'in':'out';
  return {
    name: String(r.name ?? r.姓名 ?? '未知').trim() || '未知',
    relation: r.relation ?? r.关系 ?? '其他',
    event: r.event ?? r.事由 ?? r.事件 ?? '其他',
    direction: dir,
    amount: Number(r.amount ?? r.金额 ?? 0) || 0,
    date: String(r.date ?? r.日期 ?? today()).slice(0,10),
    method: r.method ?? r.方式 ?? '',
    location: r.location ?? r.地点 ?? '',
    note: r.note ?? r.备注 ?? ''
  };
}
async function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      const parsed = JSON.parse(e.target.result);
      const arr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.records) ? parsed.records : null);
      if (!arr) throw new Error('文件格式不正确');
      const list = arr.map(normalizeRecord).filter(Boolean);
      if (!list.length) throw new Error('没有可导入的记录');
      if (!confirm(`解析到 ${list.length} 条记录，确定导入到当前账号？`)) return;
      const { error } = await supabase.from('records').insert(list);
      if (error) throw error;
      await loadRecordsFromSupabase();
      toast(`已导入 ${list.length} 条`);
    }catch(err){ toast('导入失败：'+err.message); }
  };
  reader.onerror = () => toast('文件读取失败');
  reader.readAsText(file,'utf-8');
}

/* ============================================================
 *  9. 主题切换
 * ============================================================ */
function setTheme(theme){
  document.documentElement.dataset.theme = theme;
  localStorage.setItem(THEME_KEY, theme);
  const icon = theme==='dark'?'☀️':'🌙'; const label = theme==='dark'?'浅色模式':'深色模式';
  const tb = $('#themeToggle'); if (tb) tb.textContent = `${icon} ${label}`;
  const tm = $('#themeToggleMobile'); if (tm) tm.textContent = icon;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme==='dark'?'#1e1b17':'#f6f3ee');
  if (currentView==='stats') renderStats();
}
function toggleTheme(){ const cur = document.documentElement.dataset.theme==='dark'?'light':'dark'; setTheme(cur); toast(cur==='dark'?'已切换到深色模式':'已切换到浅色模式'); }

/* ============================================================
 *  10. 全局事件绑定
 * ============================================================ */
function bindEvents(){
  $$('.nav-item, .mobile-nav-item').forEach(btn => btn.addEventListener('click', ()=>navigate(btn.dataset.view)));
  $('#themeToggle').addEventListener('click', toggleTheme);
  $('#themeToggleMobile').addEventListener('click', toggleTheme);
  $('#modalClose').addEventListener('click', closeModal);
  $('#btnCancel').addEventListener('click', closeModal);
  $('#overlay').addEventListener('click', e=>{ if (e.target===$('#overlay')) closeModal(); });
  $$('#dirSeg .seg-btn').forEach(btn=>btn.addEventListener('click', ()=>setDirection(btn.dataset.dir)));
  $('#recordForm').addEventListener('submit', saveRecord);

  document.addEventListener('click', e=>{
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    switch (act){
      case 'add': openModal(null); break;
      case 'edit': openModal(el.dataset.id); break;
      case 'del': deleteRecord(el.dataset.id); break;
      case 'goto': navigate(el.dataset.view); break;
      case 'togglePerson': { const n=el.dataset.name; if (expandedPeople.has(n)) expandedPeople.delete(n); else expandedPeople.add(n); renderPeople(); break; }
      case 'quickAdd': openModal(null, {name:el.dataset.name, relation:el.dataset.relation, direction:'out'}); break;
      case 'filterByPerson': { navigate('records'); setTimeout(()=>{ const input=$('#searchInput'); if (input){ input.value=el.dataset.name; updateRecordsTable(); } },40); break; }
      case 'clearFilter': { ['searchInput','filterDir','filterEvent','filterYear'].forEach(id=>{ const n=$('#'+id); if (n) n.value = id==='searchInput'?'':'all'; }); updateRecordsTable(); break; }
      case 'chartMode': chartMode=el.dataset.mode; renderStats(); break;
      case 'exportJSON': exportJSON(); break;
      case 'exportCSV': exportCSV(); break;
      case 'importJSON': $('#importFile').click(); break;
      case 'loadSample': if (confirm('载入 6 条示例数据？')) loadSample(); break;
      case 'clearAll': if (confirm('确定清空全部记录？不可撤销！') && confirm('再次确认：将永久删除所有数据。')){ supabase.from('records').delete().neq('id',0).then(()=>loadRecordsFromSupabase()); } break;
    }
  });

  $('#importFile').addEventListener('change', e=>{ const f=e.target.files&&e.target.files[0]; if (f) importJSONFile(f); e.target.value=''; });
  document.addEventListener('keydown', e=>{
    if (e.key==='Escape'){ if ($('#overlay').classList.contains('show')) closeModal(); }
    if (e.key.toLowerCase()==='n' && !e.metaKey && !e.ctrlKey && !e.altKey){
      const tag = (document.activeElement.tagName||'').toLowerCase();
      if (tag==='input'||tag==='textarea'||tag==='select') return;
      if ($('#overlay').classList.contains('show')) return;
      openModal(null);
    }
  });
  let rt;
  window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if (currentView==='stats') renderStats(); },200); });
}

/* ============================================================
 *  11. 初始化
 * ============================================================ */
async function init(){
  const saved = localStorage.getItem(THEME_KEY);
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(saved || (prefersDark ? 'dark' : 'light'));
  fillSelect($('#f-relation'), RELATIONS);
  fillSelect($('#f-event'), EVENT_TYPES);
  fillSelect($('#f-method'), METHODS);
  $('#f-date').value = today();
  bindEvents();
  navigate('dashboard');
  await checkAuth();
}
document.addEventListener('DOMContentLoaded', init);
